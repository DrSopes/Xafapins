name: Xafapins Daily Forecast & Web Map

on:
  schedule:
    # Se ejecuta cada día a las 06:00 UTC (07:00 / 08:00 peninsular)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Descargar meteo fresca de Cataluña
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python src/download_meteo.py --grid-step 0.08

      - name: 2. Generar gradientes predictivos (GeoJSON continuo)
        run: |
          python src/predict_engine.py --species lactarius_deliciosus
          python src/predict_engine.py --species boletus_edulis
          python src/predict_engine.py --species craterellus_lutescens
          python src/predict_engine.py --species cantharellus_cibarius
          python src/predict_engine.py --species hygrophorus_latitabundus
          python src/predict_engine.py --species tricholoma_terreum

      - name: 3. Actualizar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/*.geojson data/meteo_catalunya_latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): actualització diària de capes micològiques" && git push)

      - name: 4. Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: 5. Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
