name: Xafapins Daily Forecast & Telegram Alert

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Aquí defines los permisos que necesita GitHub Pages y el push de git:
permissions:
  contents: write    # Necesario para hacer el git push de los GeoJSON actualizados
  pages: write       # Necesario para desplegar en GitHub Pages
  id-token: write    # Necesario para que GitHub valide el despliegue de Pages

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # También se puede poner 'environment' para trackear el despliegue de Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Descargar meteo fresca de Cataluña
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python src/download_meteo.py --grid-step 0.20

      - name: 2. Ejecutar motor predictivo
        run: |
          python src/predict_engine.py --species lactarius_deliciosus
          python src/predict_engine.py --species boletus_edulis

      - name: 3. Enviar informe a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/telegram_bot.py

      - name: 4. Actualizar capas GeoJSON en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/*.geojson data/meteo_catalunya_latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): actualització diària de capes micològiques" && git push)

      - name: 5. Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: 6. Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
