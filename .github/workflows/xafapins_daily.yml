name: Build and deploy Xafapins
on:
  push:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xafapins-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check GitHub Pages configuration before downloading data
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --check web/environment-layers.js
      - run: node --check web/visual-grid.js
      - run: node --test tests/*.test.cjs
      - name: Fetch complete weather series
        env:
          PYTHONUNBUFFERED: '1'
        run: python src/download_meteo.py --grid-step 0.16 --forecast-days 7
      - name: Generate all species at 1 km display spacing
        run: python src/predict_engine.py --cell-km 1 --all-spain
      - run: python src/validate_output.py --all-spain
      - name: Prepare clean Pages artifact
        run: python src/package_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
